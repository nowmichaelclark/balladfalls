<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- The app's icon (item 120, Mikey's pick: sketch 3f). The one source of
     every icon the app uses: node tools/icons.mjs makes them all from this
     file and checks the safe zones, so a change to the icon is an edit here
     and a run of the script.

     The view is the icon itself (0 0 512 512), but the scene is drawn out to
     -128..640 each way: Android's adaptive icon is a 108 dp layer of which
     72 dp shows, and the feature graphic is wider, so both crop more of the
     same scene. Three groups: #background (the sky and the lake, Android's
     background layer), #foreground (everything on them), and #monochrome
     (one color, hidden here: Android's themed icon and the status bar's
     icon). Android's layers are vector drawables made from it, so it keeps
     to what they can draw: shapes and absolute paths, flat fills, linear
     gradients, a radial one only on a circle, a clip, a group's translate
     and scale. The class "key" marks what must stay inside every safe zone (the
     sun, the stream, its first ripple); the script fails if it doesn't. -->
<defs>
  <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512"><stop offset="0" stop-color="#2c1a4a"/><stop offset="0.43" stop-color="#5a3060"/><stop offset="0.79" stop-color="#e08a5a"/></linearGradient>
  <linearGradient id="lake" gradientUnits="userSpaceOnUse" x1="0" y1="404" x2="0" y2="512"><stop offset="0" stop-color="#4a2a58"/><stop offset="1" stop-color="#1c0e2c"/></linearGradient>
  <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="512" y1="188" x2="256" y2="404"><stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#ffd4a0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0.55" stop-color="#ffd890" stop-opacity="0.35"/><stop offset="1" stop-color="#ffd890" stop-opacity="0"/></radialGradient>
  <radialGradient id="mist"><stop offset="0" stop-color="#fff4dc" stop-opacity="0.5"/><stop offset="1" stop-color="#fff4dc" stop-opacity="0"/></radialGradient>
  <clipPath id="wclip">
    <path d="M640 186 L380 190 L380 206 H640 Z"/>
    <path d="M392 189.8 L384 190 C330 192 292 214 278 262 C268 300 262 350 256 404 H324 Q318 340 320 274 C322 236 334 208 356 206 H392 Z"/>
  </clipPath>
</defs>
<g id="background">
  <rect x="-128" y="-128" width="768" height="532" fill="url(#sky)"/>
  <rect x="-128" y="404" width="768" height="236" fill="url(#lake)"/>
  <rect x="-128" y="403" width="428" height="3" fill="#f0a070" opacity="0.6"/>
</g>
<g id="foreground">
  <circle cx="160" cy="272" r="105" fill="url(#glow)"/>
  <circle class="key" cx="160" cy="272" r="70" fill="#ffd890"/>
  <g fill="#ffd890">
    <rect x="104" y="414" width="112" height="7" rx="3.5" fill="#ffd890"/>
    <rect x="118" y="430" width="84" height="6" rx="3" fill="#f6bc7c"/>
    <rect x="130" y="445" width="60" height="6" rx="3" fill="#e2a070"/>
    <rect x="140" y="460" width="40" height="5" rx="2.5" fill="#bc7c6c"/>
    <rect x="148" y="474" width="24" height="5" rx="2.5" fill="#94606a"/>
  </g>
  <path d="M640 404 V202 Q580 198 512 206 Q446 200 384 206 L356 206 C334 206 322 226 318 256 L300 404 Z" fill="#1c0e2c"/>
  <g fill="none" stroke="#2e1a3c" stroke-width="5" stroke-linecap="round"><path d="M372 250 L440 246"/><path d="M412 300 L496 294"/><path d="M350 352 L420 348"/><path d="M530 262 L600 258"/></g>
  <path d="M640 186 L380 190 L380 206 H640 Z" fill="url(#water)"/>
  <path class="key" d="M392 189.8 L384 190 C330 192 292 214 278 262 C268 300 262 350 256 404 H324 Q318 340 320 274 C322 236 334 208 356 206 H392 Z" fill="url(#water)"/>
  <g fill="none" stroke-linecap="round" clip-path="url(#wclip)">
    <path d="M500 194 H382 C336 195 302 218 290 262 C282 300 278 340 274 386" stroke="#e8a060" stroke-width="5" opacity="0.5"/>
    <path d="M470 198 H378 C342 199 314 224 304 268 C298 300 296 320 294 350" stroke="#fffaf0" stroke-width="6"/>
    <path d="M440 202 H372 C348 203 326 230 318 274 C314 310 312 350 310 396" stroke="#e8a060" stroke-width="5" opacity="0.4"/>
  </g>
  <g transform="translate(290 398) scale(1 0.3542) translate(-290 -398)"><circle cx="290" cy="398" r="96" fill="url(#mist)"/></g>
  <g fill="none" stroke-linecap="round">
    <path class="key" d="M234 412 Q290 424 346 412" stroke="#fff0d4" stroke-width="6"/>
    <path d="M220 428 Q290 443 360 428" stroke="#eab088" stroke-width="4.5"/>
    <path d="M210 445 Q290 463 370 445" stroke="#c88070" stroke-width="3.5"/>
  </g>
</g>
<g id="monochrome" display="none" fill="#fff" transform="translate(-12 -62)">
  <circle cx="160" cy="272" r="70"/>
  <rect x="100" y="416" width="104" height="11" rx="5.5"/>
  <rect x="118" y="438" width="68" height="10" rx="5"/>
  <path d="M436 189 L384 190 C330 192 292 214 278 262 C268 300 262 350 256 404 H324 Q318 340 320 274 C322 236 334 208 356 206 H436 A8.5 8.5 0 0 0 436 189 Z"/>
  <g fill="none" stroke="#fff" stroke-linecap="round"><path d="M232 414 Q290 427 348 414" stroke-width="13"/><path d="M216 438 Q290 453 364 438" stroke-width="10"/></g>
</g>
</svg>
